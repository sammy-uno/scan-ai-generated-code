name: "General AI Multi-Language Scanner"

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  discover:
    name: Find AI PRs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix_data }}
    steps:
      - name: Build Isolated Testing Matrix Payload
        id: detect
        run: |
          echo "matrix_data<<EOF" >> $GITHUB_OUTPUT
          echo '{"include":[
            {"repo_name":"antiwork/gumroad","pr_num":"710","language":"ruby","agent_name":"OpenAI_Codex","category_name":"antiwork_SLASH_gumroad--710--ruby--OpenAI_Codex"},
            {"repo_name":"Skyvern-AI/skyvern","pr_num":"3063","language":"python","agent_name":"OpenAI_Codex","category_name":"Skyvern-AI_SLASH_skyvern--3063--python--OpenAI_Codex"}
          ]}' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  analyze:
    name: Scan ${{ matrix.repo_name }} (#${{ matrix.pr_num }}) - [${{ matrix.language }}]
    needs: discover
    runs-on: ubuntu-latest
    
    # --- CHANGE 1: TIMEOUT REDUCED TO 5 MINUTES ---
    timeout-minutes: 5
    
    # Root tier proxy handling ensures the check suite evaluates to Green (Completed)
    continue-on-error: true 
    
    env:
      CODEQL_RAM: 12000
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Prepare Workspace and Checkout PR
        id: pr_checkout
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"
          mkdir -p /tmp/scripts && cp scripts/* /tmp/scripts/ 2>/dev/null || true
          rm -rf ./*
          gh pr checkout ${{ matrix.pr_num }} --repo ${{ matrix.repo_name }}
          mkdir -p scripts && cp /tmp/scripts/* scripts/ 2>/dev/null || true

      - name: Initialize CodeQL
        id: init_codeql
        continue-on-error: true
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          db-location: ${{ runner.temp }}/codeql_db
          trap-caching: false
          queries: security-extended,security-experimental

      - name: Perform CodeQL Analysis
        id: run_analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/pr:${{ matrix.category_name }}"
          output: sarif-results
          upload: false 
          wait-for-processing: false 

      - name: Create Summary
        if: always()
        run: |
          SAFE_REPO=$(echo "${{ matrix.repo_name }}" | sed 's/\//_SLASH_/g')
          
          if [ "${{ steps.run_analysis.outcome }}" = "success" ] && [ -d "sarif-results" ]; then
            cp sarif-results/*.sarif ./results.sarif 2>/dev/null || true
            cp sarif-results/*.sarif "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${{ matrix.agent_name }}.sarif" 2>/dev/null || true
            
            # --- TRACKING COMPLETED ENTRIES ---
            echo "success" > "./${SAFE_REPO}--${{ matrix.pr_num }}.success"
            python scripts/parse-results.py || true
          else
            # --- TRACKING FAILED / TIMED OUT ENTRIES ---
            echo "failed" > "./${SAFE_REPO}--${{ matrix.pr_num }}.failed"
          fi

      - name: Save Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.category_name }}
          path: |
            *.sarif
            *.success
            *.failed

  report:
    name: Consolidate Final Report
    needs: [discover, analyze]
    
    # --- CHANGE 2: REPORT ALWAYS EXECUTES EVEN ON TIMEOUTS OR FAILURES ---
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sarif-*
          path: all-results
          merge-multiple: true

      - name: Generate Consolidated Summary
        env:
          MATRIX_JSON: ${{ needs.discover.outputs.matrix }}
        run: |
          python3 -c "
          import json, glob, os
          
          matrix_str = os.environ.get('MATRIX_JSON', '{}')
          try:
              matrix_data = json.loads(matrix_str)
              total_intended = len(matrix_data.get('include', []))
          except Exception:
              total_intended = 0
              
          all_files = sorted(glob.glob('all-results/**/*.sarif', recursive=True)) if os.path.exists('all-results') else []
          
          # Load structural metric markers from artifacts
          success_markers = glob.glob('all-results/**/*.success', recursive=True) if os.path.exists('all-results') else []
          failed_markers = glob.glob('all-results/**/*.failed', recursive=True) if os.path.exists('all-results') else []
          
          total_success = len(success_markers)
          total_failed = len(failed_markers)
          
          if total_intended == 0:
              total_intended = total_success + total_failed
              
          table_rows = []
          total_scanned = 0
          vulnerable_count = 0
          cwe_tracker = {}
          
          for f in all_files:
              fname = os.path.basename(f)
              if fname == 'results.sarif' or '--' not in fname: continue
              try:
                  name_root = fname.replace('.sarif', '')
                  parts = name_root.split('--')
                  if len(parts) < 4: continue
                  
                  repo_path = parts.replace('_SLASH_', '/')
                  pr_num = parts
                  lang = parts
                  agent = parts.replace('_', ' ')
                  
                  with open(f) as s: data = json.load(s)
                  runs = data.get('runs', [])
                  res = []
                  
                  seen_findings = set()
                  for run in runs:
                      if isinstance(run, dict):
                          for result in run.get('results', []):
                              rule_id = result.get('ruleId', 'Unknown')
                              
                              locs_data = result.get('locations', [])
                              locs = {}
                              if isinstance(locs_data, list) and len(locs_data) > 0:
                                  first_loc = locs_data
                                  locs = first_loc.get('physicalLocation', {}) if isinstance(first_loc, dict) else {}
                              elif isinstance(locs_data, dict):
                                  locs = locs_data.get('physicalLocation', {})
                              
                              path = locs.get('artifactLocation', {}).get('uri', 'Unknown')
                              line = locs.get('region', {}).get('startLine', '?')
                              
                              fingerprint = f'{rule_id}::{path}::{line}'
                              if fingerprint not in seen_findings:
                                  seen_findings.add(fingerprint)
                                  res.append(result)
                  
                  local_cwe_map = {}
                  try:
                      for run in runs:
                          if not isinstance(run, dict): continue
                          tool = run.get('tool', {})
                          all_rules = []
                          all_rules.extend(tool.get('driver', {}).get('rules', []))
                          for ext in tool.get('extensions', []):
                              all_rules.extend(ext.get('rules', []))
                          
                          for rule in all_rules:
                              r_id = rule.get('id')
                              tags = rule.get('properties', {}).get('tags', [])
                              if r_id not in local_cwe_map:
                                  local_cwe_map[r_id] = set()
                              for t in tags:
                                  if 'cwe-' in t.lower():
                                      c_num = t.lower().split('cwe-')[-1]
                                      if len(c_num) < 3:
                                          c_num = c_num.zfill(3)
                                      local_cwe_map[r_id].add(f'CWE-{c_num}'.upper())
                  except Exception as ex: 
                      print(f'Metadata extract warning for {fname}: {ex}')
                  
                  total_scanned += 1
                  if len(res) > 0: vulnerable_count += 1
                  
                  h, m, l = 0, 0, 0
                  CWE_TOP_25 = [
                      'CWE-787', 'CWE-079', 'CWE-089', 'CWE-020', 'CWE-125', 'CWE-078', 'CWE-416',
                      'CWE-022', 'CWE-352', 'CWE-434', 'CWE-476', 'CWE-502', 'CWE-190', 'CWE-287',
                      'CWE-798', 'CWE-862', 'CWE-732', 'CWE-269', 'CWE-306', 'CWE-362', 'CWE-522',
                      'CWE-611', 'CWE-918', 'CWE-077', 'CWE-400', 'CWE-088', 'CWE-094'
                  ]
                  
                  for r in res:
                      r_id = r.get('ruleId', '')
                      level = r.get('level', 'warning')
                      cwes_for_rule = local_cwe_map.get(r_id, set())
                      is_top_25 = any(c in CWE_TOP_25 for c in cwes_for_rule)
                      
                      if level == 'error' or is_top_25:
                          h += 1
                      elif level == 'warning':
                          m += 1
                      else:
                          l += 1
                  
                  if h > 0: row_severity_badge = '🔴 High'
                  elif m > 0: row_severity_badge = '🟡 Medium'
                  elif l > 0: row_severity_badge = '🔵 Low'
                  else: row_severity_badge = '🟢 Clean'
                  
                  pr_cwes = set()
                  for r in res:
                      cwes_for_rule = local_cwe_map.get(r.get('ruleId'), set())
                      if cwes_for_rule:
                          for cwe_id in cwes_for_rule:
                              cwe_tracker[cwe_id] = cwe_tracker.get(cwe_id, 0) + 1
                              pr_cwes.add(cwe_id)
                  
                  cwe_display = ', '.join(sorted(list(pr_cwes))) if pr_cwes else 'None'
                  
                  unique_files = set()
                  for r in res:
                      for loc in r.get('locations', []):
                          if isinstance(loc, dict):
                              u_uri = loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri')
                              if u_uri: unique_files.add(u_uri)
                  u_files = len(unique_files)
                  
                  full_url = '/'.join(['https://github.com', repo_path, 'pull', pr_num])
                  link_md = f'[#{pr_num}]({full_url})'
                  
                  table_rows.append(f'| {repo_path} | {link_md} | {agent} | {lang} | {row_severity_badge} | **{cwe_display}** | {h} | {m} | {l} | {len(res)} ({u_files}) |')
              except Exception as e:
                  print(f'Error processing {fname}: {e}')
          
          print('# 📊 Global Analysis Summary')
          print('\n### Executive Summary')
          # --- CHANGE 3: DISPLAYS DYNAMIC SUCCESS RATIO ON THE DASHBOARD ---
          print(f'- **Scan Completion Ratio:** {total_success}/{total_intended} PR Matrix Scans Completed Successfully 🎉')
          if total_failed > 0:
              print(f'- **Isolated Execution Drops:** {total_failed} *(Bypassed cleanly to preserve pipeline status)*')
          print(f'- **Total PRs Parsed:** {total_scanned}')
          print(f'- **PRs with Issues:** {vulnerable_count} ⚠️')
          print(f'- **Clean PRs:** {total_scanned - vulnerable_count} ✅')
          
          print('\n### Discovered AI Weaknesses (Top 5 CWE Frequency) 🎯')
          if cwe_tracker:
              for cwe, count in sorted(cwe_tracker.items(), key=lambda item: item[1], reverse=True)[:5]:
                  print(f'- **{cwe}**: Found {count} time(s)')
          else:
              print('- No distinct CWE records mapped.')
          
          print('\n| Repository | PR | AI Tool | Lang | Overall Severity | CWE Discovered | 🔴 H | 🟡 M | 🔵 L | Total (Files) |')
          print('| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |')
          for r in sorted(table_rows): print(r)
          " >> $GITHUB_STEP_SUMMARY
