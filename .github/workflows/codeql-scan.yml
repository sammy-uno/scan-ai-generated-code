name: "General AI Scanner Suite"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  discover:
    name: 1. Discover Target PR Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_config: ${{ steps.detect.outputs.matrix_data }}
    steps:
      - name: Build Isolated Testing Matrix Payload
        id: detect
        run: |
          # --- TEST OVERRIDE: TARGET THE TWO ISOLATED TESTING PRs ONLY ---
          echo "matrix_data<<EOF" >> $GITHUB_OUTPUT
          echo '{"include":[
            {"repo_name":"antiwork/gumroad","pr_num":"710","language":"ruby","agent_name":"OpenAI_Codex","category_name":"antiwork_SLASH_gumroad--710--ruby--OpenAI_Codex"},
            {"repo_name":"Skyvern-AI/skyvern","pr_num":"3063","language":"python","agent_name":"OpenAI_Codex","category_name":"Skyvern-AI_SLASH_skyvern--3063--python--OpenAI_Codex"}
          ]}' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  analyze:
    name: 2. Scan ${{ matrix.repo_name }} (#${{ matrix.pr_num }})
    needs: discover
    if: ${{ needs.discover.outputs.matrix_config != '' && fromJson(needs.discover.outputs.matrix_config).include != null }}
    runs-on: ubuntu-latest
    
    # --- CHANGE 1: TIMEOUT REDUCED TO 5 MINUTES FOR RAPID TESTING ---
    timeout-minutes: 5
    
    # --- HARD PLATFORM SAFEGUARD: GLOBAL STATUS PROTECTION ---
    # Placing continue-on-error here forces the workflow engine graph board to evaluate 
    # individual matrix row failures/timeouts as clean, successful pipeline events.
    continue-on-error: true
    
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover.outputs.matrix_config) }}
    
    steps:
      - name: Checkout Primary Scripts Root
        uses: actions/checkout@v4

      - name: Clear Workspace and Checkout Targeted PR
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"
          mkdir -p /tmp/scripts && cp scripts/* /tmp/scripts/ 2>/dev/null || true
          rm -rf ./*
          gh pr checkout ${{ matrix.pr_num }} --repo ${{ matrix.repo_name }}
          mkdir -p scripts && cp /tmp/scripts/* scripts/ 2>/dev/null || true

      - name: Initialize CodeQL Tooling Engine
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          db-location: ${{ runner.temp }}/codeql_db
          trap-caching: false
          queries: security-extended,security-experimental

      - name: Perform CodeQL Analysis
        id: run_analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/pr:${{ matrix.category_name }}"
          output: sarif-results
          upload: false
          wait-for-processing: false

      - name: Process Summary Metrics
        if: always()
        run: |
          SAFE_REPO=$(echo "${{ matrix.repo_name }}" | sed 's/\//_SLASH_/g')
          if [ "${{ steps.run_analysis.outcome }}" = "success" ] && [ -d "sarif-results" ]; then
            cp sarif-results/*.sarif ./results.sarif 2>/dev/null || true
            cp sarif-results/*.sarif "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${{ matrix.agent_name }}.sarif" 2>/dev/null || true
            echo "success" > "./${SAFE_REPO}--${{ matrix.pr_num }}.success"
            python scripts/parse-results.py || true
          else
            echo "failed" > "./${SAFE_REPO}--${{ matrix.pr_num }}.failed"
          fi

      - name: Save Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.category_name }}
          path: |
            *.sarif
            *.success
            *.failed

  report:
    name: 3. Consolidate Final Dashboard
    needs: [discover, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Available SARIF Logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sarif-*
          path: all-results
          merge-multiple: true

      - name: Generate Consolidated Summary Table
        env:
          MATRIX_JSON: ${{ needs.discover.outputs.matrix_config }}
        run: |
          python3 -c "
          import json, glob, os
          mat = json.loads(os.environ.get('MATRIX_JSON', '{}'))
          tot = len(mat.get('include', []))
          all_f = sorted(glob.glob('all-results/**/*.sarif', recursive=True)) if os.path.exists('all-results') else []
          ok_m = len(glob.glob('all-results/**/*.success', recursive=True)) if os.path.exists('all-results') else 0
          ko_m = len(glob.glob('all-results/**/*.failed', recursive=True)) if os.path.exists('all-results') else 0
          if tot == 0: tot = ok_m + ko_m
          rows, parsed, vuln, cwe_t = [], 0, 0, {}
          for f in all_f:
              fn = os.path.basename(f)
              if fn == 'results.sarif' or '--' not in fn: continue
              try:
                  p = fn.replace('.sarif', '').split('--')
                  if len(p) < 4: continue
                  repo, pr, lang, agent = p.replace('_SLASH_', '/'), p, p, p.replace('_', ' ')
                  with open(f) as s: data = json.load(s)
                  runs = data.get('runs', [])
                  res, seen, cwe_m = [], set(), {}
                  for r in runs:
                      if not isinstance(r, dict): continue
                      all_rules = r.get('tool', {}).get('driver', {}).get('rules', [])
                      for ext in r.get('tool', {}).get('extensions', []): all_rules.extend(ext.get('rules', []))
                      for rule in all_rules:
                          rid = rule.get('id')
                          if rid:
                              cwe_m[rid] = set(f'CWE-{t.lower().split(\"cwe-\")[-1].zfill(3)}'.upper() for t in rule.get('properties', {}).get('tags', []) if 'cwe-' in t.lower())
                      for r_out in r.get('results', []):
                          rid = r_out.get('ruleId', 'Unknown')
                          locs = r_out.get('locations', [])
                          loc = {}
                          if isinstance(locs, list) and len(locs) > 0: loc = locs.get('physicalLocation', {}) if isinstance(locs, dict) else {}
                          elif isinstance(locs, dict): loc = locs.get('physicalLocation', {})
                          path, line = loc.get('artifactLocation', {}).get('uri', 'Unknown'), loc.get('region', {}).get('startLine', '?')
                          if f'{rid}::{path}::{line}' not in seen:
                              seen.add(f'{rid}::{path}::{line}')
                              res.append(r_out)
                  parsed += 1
                  if res: vuln += 1
                  h, m, l, c_25 = 0, 0, 0, ['CWE-787', 'CWE-079', 'CWE-089', 'CWE-020', 'CWE-125', 'CWE-078', 'CWE-416', 'CWE-022', 'CWE-352', 'CWE-434', 'CWE-476', 'CWE-502', 'CWE-190', 'CWE-287', 'CWE-798', 'CWE-862', 'CWE-732', 'CWE-269', 'CWE-306', 'CWE-362', 'CWE-522', 'CWE-611', 'CWE-918', 'CWE-077', 'CWE-400', 'CWE-088', 'CWE-094']
                  pr_cwes = set()
                  for r_out in res:
                      rid = r_out.get('ruleId', '')
                      lvl = r_out.get('level', 'warning')
                      c_rules = cwe_m.get(rid, set())
                      if lvl == 'error' or any(c in c_25 for c in c_rules): h += 1
                      elif lvl == 'warning': m += 1
                      else: l += 1
                      for c in c_rules:
                          cwe_t[c] = cwe_t.get(c, 0) + 1
                          pr_cwes.add(c)
                  badge = '🔴 High' if h > 0 else '🟡 Medium' if m > 0 else '🔵 Low' if l > 0 else '🟢 Clean'
                  cwes_d = ', '.join(sorted(list(pr_cwes))) if pr_cwes else 'None'
                  u_files = len(set(loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri') for r_out in res for loc in r_out.get('locations', []) if isinstance(loc, dict) and loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri')))
                  lnk = f'[#{pr}](https://github.com{repo}/pull/{pr})'
                  rows.append(f'| {repo} | {lnk} | {agent} | {lang} | {badge} | **{cwes_d}** | {h} | {m} | {l} | {len(res)} ({u_files}) |')
              except Exception as e: print(f'Error: {e}')
          print('# 📊 Global Analysis Summary\n\n### Executive Summary')
          print(f'- **Scan Completion Ratio:** {ok_m}/{tot} PR Matrix Scans Completed Successfully 🎉')
          if ko_m > 0: print(f'- **Isolated Execution Drops:** {ko_m} *(Bypassed cleanly to preserve pipeline status)*')
          print(f'- **Total PRs Parsed:** {parsed}\n- **PRs with Issues:** {vuln} ⚠️\n- **Clean PRs:** {parsed - vuln} ✅\n\n### Discovered AI Weaknesses (Top 5 CWE Frequency) 🎯')
          if cwe_t:
              for c, cnt in sorted(cwe_t.items(), key=lambda x: x, reverse=True)[:5]: print(f'- **{c}**: Found {cnt} time(s)')
          else: print('- No distinct CWE records mapped.')
          print('\n| Repository | PR | AI Tool | Lang | Overall Severity | CWE Discovered | 🔴 H | 🟡 M | 🔵 L | Total (Files) |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |')
          for r in sorted(rows): print(r)
          " >> $GITHUB_STEP_SUMMARY
