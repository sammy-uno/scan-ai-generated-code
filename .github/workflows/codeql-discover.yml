name: "General AI Scanner: Discover & Dispatch"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: write

jobs:
  discover:
    name: Discover and Trigger Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Utility Repository
        uses: actions/checkout@v4

      - name: Setup Execution Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # --- REMOVED CACHE INTERFACES TO BYPASS FILE SCHEMA TRACKING LOOKUPS ---

      - name: Install Base Tracking Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow fastparquet

      - name: Run Discovery Scanner Matrix Generator
        id: detect
        env:
          GITHUB_OUTPUT: ${{ github.output }}
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          python scripts/ai_scanner.py

      - name: Dispatch Isolated Workers Asynchronously
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          MATRIX_DATA: ${{ steps.detect.outputs.matrix_data }}
        run: |
          if [ -z "$MATRIX_DATA" ] || [ "$MATRIX_DATA" = '{"include":[]}' ]; then
            echo "⚠️ No target PRs were discovered for analysis."
            exit 0
          fi

          echo "$MATRIX_DATA" | jq -c '.include[]' | while read -r target; do
            REPO=$(echo "$target" | jq -r '.repo_name')
            PR=$(echo "$target" | jq -r '.pr_num')
            LANG=$(echo "$target" | jq -r '.language')
            AGENT=$(echo "$target" | jq -r '.agent_name')
            CAT=$(echo "$target" | jq -r '.category_name')

            echo "🚀 Dispatching dedicated worker for: $REPO (#$PR) [$LANG]"
            
            gh api /repos/${{ github.repository }}/dispatches \
              -F event_type=run-ai-scan \
              -F client_payload[repo_name]="$REPO" \
              -F client_payload[pr_num]="$PR" \
              -F client_payload[language]="$LANG" \
              -F client_payload[agent_name]="$AGENT" \
              -F client_payload[category_name]="$CAT"
          done
