name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Scripts Root
        uses: actions/checkout@v4

      # --- FIXED: RUN-ID SCOPING COMPLETES IN SECONDS WITH ZERO INFINITE LOOP TRAPS ---
      - name: Fetch Current Active Scanner Artifacts Pool
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            console.log("==================================================");
            console.log("🔍 LIVE RUN ARTIFACT HARVESTER ENGAGED");
            console.log("==================================================");
            
            mkdirSyncRecursive('all-results');

            // 1. Fetch workflows dynamically from the repository configuration
            const allWorkflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // Locate workflows by checking path configurations explicitly
            const aiWorkflow = allWorkflows.data.workflows.find(w => w.path.endsWith('codeql-scan.yml'));
            const humanWorkflow = allWorkflows.data.workflows.find(w => w.path.endsWith('human-codeql-scan.yml'));

            const targetRunIds = [];

            // 2. Query the SINGLE most recent COMPLETED execution run ID for each pipeline
            if (aiWorkflow) {
              const aiRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: aiWorkflow.id,
                status: 'completed',
                per_page: 1
              });
              if (aiRuns.data.workflow_runs.length > 0) {
                targetRunIds.push(aiRuns.data.workflow_runs[0].id);
                console.log(`🤖 Latest Completed AI Run ID: ${aiRuns.data.workflow_runs[0].id}`);
              }
            }

            if (humanWorkflow) {
              const humanRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: humanWorkflow.id,
                status: 'completed',
                per_page: 1
              });
              if (humanRuns.data.workflow_runs.length > 0) {
                targetRunIds.push(humanRuns.data.workflow_runs[0].id);
                console.log(`👨‍💻 Latest Completed Human Run ID: ${humanRuns.data.workflow_runs[0].id}`);
              }
            }

            // 3. Download and unpack ONLY the files belonging to those two specific runs
            for (const runId of targetRunIds) {
              console.log(`\n📥 Fetching active artifact data structures for Run ID: ${runId}`);
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });

              const artifacts = response.data.artifacts.filter(art => art.name.startsWith('sarif-'));
              console.log(` -> Found ${artifacts.length} matching packages inside this run container.`);
              
              for (const artifact of artifacts) {
                try {
                  console.log(` -> Unpacking: ${artifact.name}`);
                  const zip = await github.rest.actions.downloadArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                    archive_format: 'zip',
                  });

                  const targetDir = path.join('all-results', artifact.name);
                  mkdirSyncRecursive(targetDir);
                  const zipPath = path.join(targetDir, 'artifact.zip');
                  fs.writeFileSync(zipPath, Buffer.from(zip.data));
                  execSync(`unzip -o "${zipPath}" -d "${targetDir}" && rm "${zipPath}"`);
                } catch (err) {
                  console.log(` ❌ Failed to ingest archive ${artifact.name}: ${err.message}`);
                }
              }
            }

            console.log("\n==================================================");
            console.log("📊 TARGET RUN SEEDING COMPLETE.");
            console.log("==================================================");

            function mkdirSyncRecursive(dir) {
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
            }
            function execSync(cmd) {
              require('child_process').execSync(cmd, { stdio: 'ignore' });
            }

      - name: Run Global Comparison Engine
        run: |
          python scripts/compare-reports.py
