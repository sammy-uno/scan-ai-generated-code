name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Scripts Root
        uses: actions/checkout@v4

      # --- FIX: REPLACES BRITTLE DOWNLOAD ACTION WITH DYNAMIC HISTORICAL HARVESTER ---
      - name: Fetch Historical Scanner Run Artifacts Pool
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            console.log("🔍 Scanning repository workspace run history for 'sarif-*' payload packages...");
            mkdirSyncRecursive('all-results');

            // 1. Fetch available artifact metadata list from the remote repository
            const response = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const artifacts = response.data.artifacts.filter(art => art.name.startsWith('sarif-'));
            console.log(`🎯 Located ${artifacts.length} target matching artifact archives in storage pool.`);

            // 2. Download and unpack files flat directly into the target folder context
            for (const artifact of artifacts) {
              try {
                console.log(`📥 Streaming download for archive packet: ${artifact.name}`);
                const zip = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });

                // Write and unzip using standard shell utilities to force flat layout mapping
                const zipPath = path.join('all-results', `${artifact.name}.zip`);
                fs.writeFileSync(zipPath, Buffer.from(zip.data));
                execSync(`unzip -o "${zipPath}" -d all-results/ && rm "${zipPath}"`);
              } catch (err) {
                console.log(`⚠️ Failed to securely ingest archive packet ${artifact.name}: ${err.message}`);
              }
            }

            function mkdirSyncRecursive(dir) {
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
            }
            function execSync(cmd) {
              require('child_process').execSync(cmd, { stdio: 'ignore' });
            }

      - name: Run Global Comparison Engine
        run: |
          python scripts/compare-reports.py
