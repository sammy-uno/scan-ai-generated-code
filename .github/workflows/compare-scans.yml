name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Utility Scripts Root
        uses: actions/checkout@v4

      - name: Get Latest Run Details
        id: runs
        run: |
          echo "🔍 Querying recent execution timelines using elevated administrative token..."
          
          # --- FIXED: USING ELEVATED PAT SECURES PERMISSIONS TO PREVENT SILENT BLANK [] RESPONSES ---
          AI_DATA=$(gh run list --workflow codeql-scan.yml --status success --limit 1 --json databaseId,createdAt)
          HU_DATA=$(gh run list --workflow human-codeql-scan.yml --status success --limit 1 --json databaseId,createdAt)
          
          echo "Raw AI Metadata: $AI_DATA"
          echo "Raw Human Metadata: $HU_DATA"
          
          # --- TYPE-SAFE SELECTORS EXTRACT PROPERTY VALUES GRACEFULLY ---
          AI_ID=$(echo "$AI_DATA" | jq -r '.[0].databaseId // empty')
          AI_TIME=$(echo "$AI_DATA" | jq -r '.[0].createdAt // "N/A"')
          
          HU_ID=$(echo "$HU_DATA" | jq -r '.[0].databaseId // empty')
          HU_TIME=$(echo "$HU_DATA" | jq -r '.[0].createdAt // "N/A"')

          # Fallback check: If explicit indexing yields empty strings, leverage deep search scalars
          if [ -z "$AI_ID" ]; then AI_ID=$(echo "$AI_DATA" | jq -r '..databaseId // "null"'); fi
          if [ -z "$HU_ID" ]; then HU_ID=$(echo "$HU_DATA" | jq -r '..databaseId // "null"'); fi

          echo "ai_run_id=$AI_ID" >> $GITHUB_OUTPUT
          echo "ai_time_utc=$AI_TIME" >> $GITHUB_OUTPUT
          echo "hu_run_id=$HU_ID" >> $GITHUB_OUTPUT
          echo "hu_time_utc=$HU_TIME" >> $GITHUB_OUTPUT

          echo "--- PROCESSED DICTIONARY LOGS ---"
          echo "AI_ID: $AI_ID | AI_TIME: $AI_TIME"
          echo "HU_ID: $HU_ID | HU_TIME: $HU_TIME"
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}

      - name: Download Target Run Artifacts
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          AI_RUN_ID: ${{ steps.runs.outputs.ai_run_id }}
          HU_RUN_ID: ${{ steps.runs.outputs.hu_run_id }}
        run: |
          # Download and unpack only the files belonging to those two specific run IDs
          for RUN_ID in $AI_RUN_ID $HU_RUN_ID; do
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ] || [ "$RUN_ID" = "" ]; then
              continue
            fi
            
            echo "📥 Unpacking artifact packages from Run ID: $RUN_ID"
            RUN_ARTIFACTS=$(gh api "/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts")
            
            echo "$RUN_ARTIFACTS" | jq -c '.artifacts[] | select(.name | startswith("sarif-"))' | while read -r art; do
              ART_ID=$(echo "$art" | jq -r '.id')
              ART_NAME=$(echo "$art" | jq -r '.name')
              
              mkdir -p "all-results/$ART_NAME"
              gh api "/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > "all-results/$ART_NAME/pack.zip"
              unzip -o "all-results/$ART_NAME/pack.zip" -d "all-results/$ART_NAME"
              rm -f "all-results/$ART_NAME/pack.zip"
            done
          done

      - name: Run Global Comparison Engine
        env:
          AI_RUN_TIME: ${{ steps.runs.outputs.ai_time_utc }}
          HUMAN_RUN_TIME: ${{ steps.runs.outputs.hu_time_utc }}
        run: |
          python scripts/compare-reports.py
