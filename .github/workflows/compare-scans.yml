name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Utility Scripts Root
        uses: actions/checkout@v5

      - name: Get Latest Run Details
        id: runs
        run: |
          echo "===================================================="
          echo "🔍 STAGE 1: QUERYING RAW RUN TREES VIA GITHUB CLI"
          echo "===================================================="
          
          # Query by both methods simultaneously to print visibility checks
          AI_DATA=$(gh run list --workflow "codeql-scan.yml" --status success --limit 1 --json databaseId,createdAt)
          HU_DATA=$(gh run list --workflow "human-codeql-scan.yml" --status success --limit 1 --json databaseId,createdAt)
          
          echo "📝 [LOG] Raw AI CLI Response:   $AI_DATA"
          echo "📝 [LOG] Raw Human CLI Response: $HU_DATA"
          
          echo "===================================================="
          echo "⚙️ STAGE 2: PARSING JSON STRING PROPERTIES VIA JQ"
          echo "===================================================="
          
          # HARDENED FIX: Changed '..' to '.[0]' to strictly slice the first row object
          AI_ID=$(echo "$AI_DATA" | jq -r '.[0].databaseId // "null"')
          AI_TIME=$(echo "$AI_DATA" | jq -r '.[0].createdAt // "null"')
          HU_ID=$(echo "$HU_DATA" | jq -r '.[0].databaseId // "null"')
          HU_TIME=$(echo "$HU_DATA" | jq -r '.[0].createdAt // "null"')
          
          echo "📊 [PARSED EFFECT] AI_ID:   $AI_ID"
          echo "📊 [PARSED EFFECT] AI_TIME: $AI_TIME"
          echo "📊 [PARSED EFFECT] HU_ID:   $HU_ID"
          echo "📊 [PARSED EFFECT] HU_TIME: $HU_TIME"

          echo "ai_run_id=$AI_ID" >> $GITHUB_OUTPUT
          echo "ai_time_utc=$AI_TIME" >> $GITHUB_OUTPUT
          echo "hu_run_id=$HU_ID" >> $GITHUB_OUTPUT
          echo "hu_time_utc=$HU_TIME" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}

      - name: Download Target Run Artifacts
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          AI_RUN_ID: ${{ steps.runs.outputs.ai_run_id }}
          HU_RUN_ID: ${{ steps.runs.outputs.hu_run_id }}
        run: |
          for RUN_ID in $AI_RUN_ID $HU_RUN_ID; do
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              continue
            fi
            
            echo "📥 Downloading artifact packages natively from Run ID: $RUN_ID"
            
            # Uses native gh tracking to down-stream binary zip content to an explicit sub-folder
            gh run download "$RUN_ID" --repo "${{ github.repository }}" --pattern "sarif-*" --dir "all-results" || true
          done
          
          echo "📁 Unpacked Directory State Check:"
          ls -R all-results || true

      - name: Run Global Comparison Engine
        env:
          AI_RUN_TIME: ${{ steps.runs.outputs.ai_time_utc }}
          HUMAN_RUN_TIME: ${{ steps.runs.outputs.hu_time_utc }}
          AI_RUN_ID: ${{ steps.runs.outputs.ai_run_id }}
          HUMAN_RUN_ID: ${{ steps.runs.outputs.hu_run_id }}
          REPO_NAME: ${{ github.repository }}
          SERVER_URL: "https://github.com"
          # 🚀 INJECTED: Grants credential context so the script can filter out background debt
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          python scripts/compare-reports.py

