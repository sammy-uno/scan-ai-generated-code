name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Utility Scripts Root
        uses: actions/checkout@v4

      # --- FIXED: NATIVE RECURSIVE DOWNLOAD ENGINE BYPASSES API INDICES ---
      - name: Download Available Artifacts Pool
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sarif-*
          path: all-results
          merge-multiple: true

      - name: Run Global Comparison Engine
        run: |
          python scripts/compare-reports.py
