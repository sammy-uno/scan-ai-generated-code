name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Utility Scripts Root
        uses: actions/checkout@v4

      - name: Fetch Current Active Scanner Artifacts Pool
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            console.log("🔍 Extracting current workflow timestamps and downloading artifacts...");
            mkdirSyncRecursive('all-results');

            const aiRuns = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'codeql-scan.yml', 
              status: 'completed',
              per_page: 1
            });

            const humanRuns = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'human-codeql-scan.yml', 
              status: 'completed',
              per_page: 1
            });

            let aiTime = "N/A";
            let humanTime = "N/A";
            const targetRunIds = [];

            if (aiRuns.data.workflow_runs.length > 0) {
              const run = aiRuns.data.workflow_runs[0];
              targetRunIds.push(run.id);
              aiTime = run.created_at;
              console.log(`🤖 AI Workflow Run: ${run.id} | Executed At: ${aiTime}`);
            }

            if (humanRuns.data.workflow_runs.length > 0) {
              const run = humanRuns.data.workflow_runs[0];
              targetRunIds.push(run.id);
              humanTime = run.created_at;
              console.log(`👨‍💻 Human Workflow Run: ${run.id} | Executed At: ${humanTime}`);
            }

            // Export timestamps globally so any subsequent step reads them automatically
            core.exportVariable('AI_RUN_TIME', aiTime);
            core.exportVariable('HUMAN_RUN_TIME', humanTime);

            for (const runId of targetRunIds) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });

              const artifacts = response.data.artifacts.filter(art => art.name.startsWith('sarif-'));
              
              for (const artifact of artifacts) {
                try {
                  console.log(`📥 Downloading Active Package: ${artifact.name}`);
                  const zip = await github.rest.actions.downloadArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                    archive_format: 'zip',
                  });

                  const targetDir = path.join('all-results', artifact.name);
                  mkdirSyncRecursive(targetDir);
                  const zipPath = path.join(targetDir, 'artifact.zip');
                  fs.writeFileSync(zipPath, Buffer.from(zip.data));
                  execSync(`unzip -o "${zipPath}" -d "${targetDir}" && rm "${zipPath}"`);
                } catch (err) {
                  console.log(`⚠️ Ingestion failed for ${artifact.name}: ${err.message}`);
                }
              }
            }

            function mkdirSyncRecursive(dir) {
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
            }
            function execSync(cmd) {
              require('child_process').execSync(cmd, { stdio: 'ignore' });
            }

      - name: Run Global Comparison Engine
        # --- FIXED: REMOVED BLANK STEP-LEVEL TEMPLATE OVERRIDES TO RESTORE ENVIRONMENT VARIABLES ---
        run: |
          python scripts/compare-reports.py
