name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Utility Scripts Root
        uses: actions/checkout@v4

      # --- FIX: HARDCODED FILENAMES BYPASS PATH FINDING LOOPS ENTIRELY ---
      - name: Fetch Current Active Scanner Artifacts Pool
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          mkdir -p all-results
          echo "🔍 Querying recent execution timelines for targeted workflow file profiles..."
          
          # 1. Fetch the single absolute latest completed run ID matching the core filenames directly
          AI_RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/workflows/codeql-scan.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].id')
          HUMAN_RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/workflows/human-codeql-scan.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].id')
          
          echo "🤖 Active AI Scanner Run ID resolved: $AI_RUN_ID"
          echo "👨‍💻 Active Human Scanner Run ID resolved: $HUMAN_RUN_ID"
          
          # 2. Iterate dynamically over the resolved run tracking variables
          for RUN_ID in $AI_RUN_ID $HUMAN_RUN_ID; do
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              continue
            fi
            
            echo "📥 Extracting artifact packages from Run container: $RUN_ID"
            
            # Pull down the corresponding artifacts list for this specific run ID only
            RUN_ARTIFACTS=$(gh api "/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts")
            
            echo "$RUN_ARTIFACTS" | jq -c '.artifacts[] | select(.name | startswith("sarif-"))' | while read -r art; do
              ART_ID=$(echo "$art" | jq -r '.id')
              ART_NAME=$(echo "$art" | jq -r '.name')
              
              echo " -> Unpacking package: $ART_NAME"
              mkdir -p "all-results/$ART_NAME"
              
              # Stream the binary download payload into a temporary zip container natively
              gh api "/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > "all-results/$ART_NAME/pack.zip"
              unzip -o "all-results/$ART_NAME/pack.zip" -d "all-results/$ART_NAME"
              rm -f "all-results/$ART_NAME/pack.zip"
            done
          done

      - name: Run Global Comparison Engine
        run: |
          python scripts/compare-reports.py
