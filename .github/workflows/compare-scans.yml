name: "Compare AI vs Human Scans"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  compare:
    name: Aggregate and Compare Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Scripts Root
        uses: actions/checkout@v4

      - name: Download Automated Scanner Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sarif-*
          path: all-results
          merge-multiple: true

      - name: Run Global Comparison Engine
        run: |
          # --- CALLS standalone Python script to evaluate comparison matrices safely ---
          python scripts/compare-reports.py
