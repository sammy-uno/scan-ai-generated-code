name: "📊 Universal HTML Report Deployer"

on:
  workflow_dispatch:  # Purely human-driven manual button trigger

permissions:
  contents: write
  actions: read

jobs:
  build-report:
    name: Compile Master Dashboard
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🎯 TARGETED SINGLE-RUN STREAMING: Automatically extracts the absolute latest 
      # run ID of your scanner matrix and isolates its specific artifact slices cleanly!
      - name: Download Scan Artifact Slices from Latest Run
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          mkdir -p all-results
          
          echo "🔍 Finding the latest Run ID for 'General AI Multi-Language Scanner'..."
          # Query GitHub API for the most recent completed or running execution tracking ID
          LATEST_RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/codeql-scan.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          
          if [ -z "$LATEST_RUN_ID" ] || [ "$LATEST_RUN_ID" = "null" ]; then
            echo "❌ ERROR: Could not locate any historical runs for the specified scanning pipeline."
            exit 1
          fi
          echo "🎯 Isolated Latest Scanner Run ID: $LATEST_RUN_ID"
          
          echo "📥 Extracting individual artifact chunks for this run..."
          # Fetch only the individual artifact slice IDs that belong strictly to that specific Run ID
          ART_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/$LATEST_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | .id')
          
          for ART_ID in $ART_IDS; do
            echo "⚡ Downloading artifact chunk ID: $ART_ID"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > chunk.zip
            unzip -o chunk.zip -d all-results/ 2>/dev/null || true
            rm -f chunk.zip
          done

      - name: 🔍 Debug Path Inspection
        run: |
          echo "=== VERIFYING SINGLE RUN DOWNLOADS ==="
          ls -R all-results
          echo "======================================"

      - name: Compile HTML Master Dashboard
        run: |
          mkdir -p docs
          python scripts/generate_interactive_dashboard.py

      - name: 📦 Archive Interactive HTML Report Package
        uses: actions/upload-artifact@v4
        with:
          name: compiled-interactive-dashboard
          path: docs/GLOBAL_INTERACTIVE_REPORT.html
          retention-days: 7
