name: "📊 Universal HTML Report Deployer"

on:
  workflow_dispatch:  # Purely human-driven manual button trigger

permissions:
  contents: write
  actions: read

jobs:
  build-report:
    name: Compile Master Dashboard
    runs-on: ubuntu-latest
    
    steps:
      # 🎯 STEP 1: Pull your python scripts down from your main branch
      - name: Checkout Code Scripts from Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🎯 STEP 2: RUN-ID COMPLIANCE LAYER
      # Locates the SINGLE most recent run ID of your scanning workflow 
      # to guarantee zero historical or duplicate files leak into your HTML folder view!
      - name: Download Scan Artifact Slices from Latest Run
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          mkdir -p all-results
          echo "🔍 Finding the most recent run of the Chained Scanner workflow..."
          
          # 🎯 THE CLOUD FIX: Fetches the single newest Run ID from your active scanning workflow
          LATEST_SCAN_RUN_ID=$(gh run list --workflow "AI Multi-Language Chained Scanner" --limit 1 --json databaseId --jq '.[0].databaseId')
          
          if [ -z "$LATEST_SCAN_RUN_ID" ] || [ "$LATEST_SCAN_RUN_ID" = "null" ]; then
            echo "⚠️ Could not locate a specific scanning workflow run. Falling back to global lookup..."
            LATEST_SCAN_RUN_ID="${{ github.run_id }}"
          fi
          
          echo "📥 Fetching scan artifact lists straight from isolated Run ID: $LATEST_SCAN_RUN_ID"
          
          # Query and extract matching artifacts belonging ONLY to that specific latest run pass!
          ART_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/$LATEST_SCAN_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | contains("sarif")) | .id')
          
          if [ -z "$ART_IDS" ]; then
            echo "❌ No matching sarif containers found inside the latest run."
            exit 1
          fi
          
          for ART_ID in $ART_IDS; do
            echo "⚡ Extracting artifact package chunk ID: $ART_ID"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > chunk.zip
            unzip -o chunk.zip -d all-results/ 2>/dev/null || true
            rm -f chunk.zip
          done
          
      # 🎯 STEP 3: Fallback extraction step if CodeQL generated nested raw sarif findings
      - name: ⚙️ Extract Internal SARIF Records
        run: |
          cd all-results
          if ls *.zip 1> /dev/null 2>&1; then
            for f in *.zip; do unzip -o "$f" 2>/dev/null || true; done
          fi
          
          # 🎯 THE CLOUD FIX: Deletes intermediate matrix duplicates so we keep EXACTLY your 20 unique items
          rm -f *--*--*--*--*.success.json 2>/dev/null || true
          rm -f *--*--*--*--*.failed.json 2>/dev/null || true
          cd ..

      - name: 🔍 Debug Path Inspection
        run: |
          echo "=== VERIFYING INTEGRATED DIRECTORY CONTROLLERS ==="
          ls -R all-results
          echo "=================================================="

      - name: Compile HTML Master Dashboard
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          mkdir -p docs
          python scripts/generate_interactive_dashboard.py

      - name: 📦 Archive Interactive HTML Report Package
        uses: actions/upload-artifact@v4
        with:
          name: compiled-interactive-dashboard
          path: docs/GLOBAL_INTERACTIVE_REPORT.html
          retention-days: 7
