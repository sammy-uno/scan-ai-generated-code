name: "📊 Universal HTML Report Deployer"

on:
  workflow_dispatch:  # 🎯 Purely human-driven. Only runs when YOU click the button manually.

permissions:
  contents: read      # 🎯 Strict Read-Only. Completely bars any automated bots from writing to your repo files.
  actions: read

jobs:
  build-report:
    name: Compile Master Dashboard
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Scan Artifact Slices
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-results
          merge-multiple: true
          github-token: ${{ secrets.GLOBAL_SCAN_PAT }}

      # 🎯 COMPUTE STEP: Compiles the dashboard report inside a dedicated local docs directory
      - name: Compile HTML Master Dashboard
        run: |
          mkdir -p docs
          python scripts/generate_interactive_dashboard.py

      # 🎯 MANUAL DOWNLOAD ONLY: Archives the report safely in the cloud context. 
      # No automated bots, no automatic commits, and zero changes to your code branches!
      - name: 📦 Archive Interactive HTML Report Package
        uses: actions/upload-artifact@v4
        with:
          name: compiled-interactive-dashboard
          path: docs/GLOBAL_INTERACTIVE_REPORT.html
          retention-days: 7
