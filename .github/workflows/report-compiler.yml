name: "📊 Universal HTML Report Deployer"

on:
  workflow_dispatch:  # Purely human-driven manual button trigger

permissions:
  contents: write
  actions: read

jobs:
  build-report:
    name: Compile Master Dashboard
    runs-on: ubuntu-latest
    
    steps:
      # 🎯 STEP 1: Pull your python scripts down from your main branch
      - name: Checkout Code Scripts from Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🎯 STEP 2: DYNAMICS SCANNER FETCHING - Pulls ALL raw slice artifacts from your last scan run
      - name: Download Scan Artifact Slices from Latest Run
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          mkdir -p all-results
          echo "🔍 Searching for the most recent scanning workflow run..."
          LATEST_RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=10" \
            --jq '.workflow_runs[] | select(.name | contains("Scanner") or contains("AI")) | .id' | head -n 1)
          
          if [ -z "$LATEST_RUN_ID" ] || [ "$LATEST_RUN_ID" = "null" ]; then
            LATEST_RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=1" --jq '.workflow_runs.id')
          fi
          
          echo "🎯 Target Master Run ID Isolated: $LATEST_RUN_ID"
          
          echo "📥 Extracting all artifact packages..."
          # Pull down every artifact zip container registered under that single execution run
          ART_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/$LATEST_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | .id')
          
          for ART_ID in $ART_IDS; do
            echo "⚡ Extracting artifact package chunk ID: $ART_ID"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > chunk.zip
            unzip -o chunk.zip -d all-results/ 2>/dev/null || true
            rm -f chunk.zip
          done

      # 🎯 STEP 3: Fallback extraction step if CodeQL generated nested raw sarif findings
      - name: ⚙️ Extract Internal SARIF Records
        run: |
          cd all-results
          if ls *.zip 1> /dev/null 2>&1; then
            for f in *.zip; do unzip -o "$f" 2>/dev/null || true; done
          fi
          cd ..

      - name: 🔍 Debug Path Inspection
        run: |
          echo "=== VERIFYING INTEGRATED DIRECTORY CONTROLLERS ==="
          ls -R all-results
          echo "=================================================="

      - name: Compile HTML Master Dashboard
        run: |
          mkdir -p docs
          python scripts/generate_interactive_dashboard.py

      - name: 📦 Archive Interactive HTML Report Package
        uses: actions/upload-artifact@v4
        with:
          name: compiled-interactive-dashboard
          path: docs/GLOBAL_INTERACTIVE_REPORT.html
          retention-days: 7
