name: Human CodeQL Scan Auditing

on:
  workflow_dispatch:

jobs:
  discover:
    name: Find Human Audit PRs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix_data }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Discover Scan Matrix
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          pip install pandas
          python scripts/human-scanner.py

  analyze:
    name: CodeQL Human Audit
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: ${{ needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Workspace and Checkout PR
        id: pr_checkout
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"
          
          # 📁 SAFE CLEANUP: Preserve your critical root .git database directory
          mkdir -p /tmp/scripts && cp scripts/* /tmp/scripts/ 2>/dev/null || true
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' -exec rm -rf {} +
          
          # 🎯 TRUE FORK ANCESTOR FETCHING: Pull full PR branch history logs
          echo "📥 Fetching full upstream baseline and PR reference trees..."
          git fetch origin main:main --depth=1000 || git fetch origin main:main --unshallow || true
          git fetch origin pull/${{ matrix.pr_num }}/head:pr_${{ matrix.pr_num }} --depth=1000 || true
          
          # Switch cleanly to the compiled PR branch
          git checkout pr_${{ matrix.pr_num }}
          
          # Restore tracking utility scripts
          mkdir -p scripts && cp /tmp/scripts/* scripts/ 2>/dev/null || true

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.primary_language }}
          queries: security-extended,security-and-quality

      - name: Autobuild Repository Source
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis Sweep
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.primary_language }}"
          upload: false
          output: sarif-results

      - name: Standardize SARIF Asset Output File
        run: |
          mkdir -p total-sarif
          if [ -f "sarif-results/${{ matrix.primary_language }}.sarif" ]; then
            cp "sarif-results/${{ matrix.primary_language }}.sarif" results.sarif
          elif [ -f "sarif-results/issues.sarif" ]; then
            cp "sarif-results/issues.sarif" results.sarif
          else
            find sarif-results/ -name "*.sarif" -exec cp {} results.sarif \;
          fi

      - name: Execute PR Introduced Isolated Line Filters
        env:
          PR_REPO: ${{ matrix.repo_name }}
          PR_NUM:  ${{ matrix.pr_num }}
          PR_LOC:  ${{ matrix.live_loc }}
        run: |
          python scripts/parse-results.py

      - name: Stash Processed Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-human--${{ matrix.safe_repo }}--${{ matrix.pr_num }}--${{ matrix.primary_language }}--${{ matrix.live_loc }}
          path: |
            results.sarif
          retention-days: 1

  report:
    name: Consolidate Final Report
    needs: [discover, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Download Available Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sarif-*
          path: all-results
          merge-multiple: true

      - name: Purge Historical Cache Clones
        run: |
          find all-results/ -name "results.sarif" -delete || true
          echo "📁 Active Clean Artifacts Queue Check:"
          ls -R all-results/

      - name: Generate Consolidated Summary Table
        env:
          MATRIX_JSON: ${{ needs.discover.outputs.matrix }}
          SCAN_TYPE: "human"
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }} 
        run: |
          python scripts/consolidate-report.py
