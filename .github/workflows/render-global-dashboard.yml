name: "AI Scanner - Render Global Dashboard"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  display_report:
    name: Build Repository Dashboard File
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Fetch the persistent data snapshot from your database lane
      - name: Restore Shared Database State
        run: |
          mkdir -p all-results
          git fetch origin database:database || true
          git checkout database -- all-results/accumulated_database.json 2>/dev/null || echo "Database file located."

      # 2. Compile the chunks using your dedicated copy script
      - name: Compile Text Matrices
        env:
          MATRIX_JSON: "{}"
          SCAN_TYPE: "automated"
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }} 
        run: |
          python scripts/render-dashboard-tables.py

      # 3. THE FILE STITCHING ENGINE: Combines the text fragments into one clean, permanent file
      - name: Assemble Global Summary Report File
        run: |
          echo "📝 Stitching compliance chunks into a permanent file asset..."
          
          if [ -f "report-chunks/header.md" ]; then
            cat report-chunks/header.md > GLOBAL_SUMMARY_REPORT.md
            echo -e "\n" >> GLOBAL_SUMMARY_REPORT.md
          else
            echo "# 📊 Global Analysis Summary\n" > GLOBAL_SUMMARY_REPORT.md
          fi
          
          if [ -d "report-chunks" ]; then
            for file in $(ls report-chunks/table_part_*.md 2>/dev/null | sort -V); do
              echo "Appending $file..."
              cat "$file" >> GLOBAL_SUMMARY_REPORT.md
              echo -e "\n\n" >> GLOBAL_SUMMARY_REPORT.md
            done
          fi

      # 4. SAVE BACK TO REPOSITORY: Automatically pushes the file to your code tree
      - name: Commit Report File to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase || true
          
          git add GLOBAL_SUMMARY_REPORT.md
          git commit -m "docs: update compiled global analysis summary report file" || true
          git push origin main
