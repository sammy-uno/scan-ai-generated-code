name: "AI Scanner - Render Global Dashboard"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  display_report:
    name: Build Repository Dashboard File
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 1. Fetch the persistent data snapshot from your database lane
      - name: Restore Shared Database State
        run: |
          echo "📥 Extracting raw database from tracking storage layer..."
          mkdir -p all-results
          git fetch origin database:database || true
          git checkout database -- all-results/accumulated_database.json 2>/dev/null || echo "Starting fresh snapshot."

      # 2. Compile the chunks using your dedicated copy script
      - name: Compile Text Matrices
        env:
          MATRIX_JSON: "{}"
          SCAN_TYPE: "automated"
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }} 
        run: |
          python scripts/render-dashboard-tables.py

      # 3. 🎯 BULLETPROOF ASSEMBLY: Stitch the report-chunks folder files explicitly
      - name: Assemble Global Summary Report File
        run: |
          echo "📝 Stitching compliance chunks into a permanent file asset..."
          
          # Build the master file header
          if [ -f "report-chunks/header.md" ]; then
            cat report-chunks/header.md > GLOBAL_SUMMARY_REPORT.md
            echo -e "\n" >> GLOBAL_SUMMARY_REPORT.md
          else
            echo -e "# 📊 Global Analysis Summary\n\n### Executive Summary\n" > GLOBAL_SUMMARY_REPORT.md
          fi
          
          # Force read the exact report-chunks directory and merge files sequentially
          cd report-chunks
          for file in $(ls table_part_*.md 2>/dev/null | sort -V); do
            echo "Processing $file..."
            cat "$file" >> ../GLOBAL_SUMMARY_REPORT.md
            echo -e "\n\n" >> ../GLOBAL_SUMMARY_REPORT.md
          done
          cd ..
          
          echo "✅ Compilation complete. File size details:"
          ls -lh GLOBAL_SUMMARY_REPORT.md

      # 4. 📤 FORCE COMMIT AND PUSH: Overwrites the old file on main branch cleanly
      - name: Commit Report File to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git checkout main
          git pull origin main --rebase || true
          
          # Clean up the untracked directory completely so it doesn't block Git
          rm -rf report-chunks/
          
          if [ -f "GLOBAL_SUMMARY_REPORT.md" ]; then
            git add GLOBAL_SUMMARY_REPORT.md
            # 🎯 The '--allow-empty' flag forces Git to commit and push the file no matter what!
            git commit --allow-empty -m "docs: finalize global analysis summary report file [compiled entries]"
            git push origin main --force
            echo "✅ Global summary report successfully committed and pushed to main branch!"
          else
            echo "❌ Error: GLOBAL_SUMMARY_REPORT.md was not found."
            exit 1
          fi
