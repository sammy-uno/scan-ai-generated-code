name: "TEST - AI Multi-Language Chained Scanner"

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'CSV Line Data Offset Pointer'
        required: false
        default: '0'
  repository_dispatch:
    types: [run_test_chunk]

env:
  CODEQL_ACTION_EXPERIMENTAL_FEATURES: "false"
  CODEQL_ACTION_DISABLE_DEPRECATION_WARNINGS: "true"
  CODEQL_ACTION_IS_PERFORMANCE_TESTING: "true"

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  discover:
    name: Find AI PRs
    runs-on: ubuntu-latest
    # 🚀 JOB OUTPUT BRIDGE: Maps individual step parameters to global job variables
    outputs:
      matrix: ${{ steps.detect.outputs.matrix_data }}
      next_offset: ${{ steps.detect.outputs.next_offset }}
      has_more_data: ${{ steps.detect.outputs.has_more_data }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # Forces Git to match your current active side branch context
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Downloads the database from prior runs so that scripts/ai-scanner.py can perform deduplication checks
      - name: Fetch Historical Database Snapshot for Deduplication
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          echo "📥 Downloading master database to hydrate scanner deduplication memory..."
          gh run download --name "master-database-accumulation" --dir "all-results" || true

      - name: Discover Scan Matrix
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          CHUNK_OFFSET: ${{ github.event.inputs.offset || github.event.client_payload.offset || '0' }}
        run: |
          pip install pandas
          python scripts/ai-scanner.py
          
  analyze:
    name: Scan ${{ matrix.repo_name }} (#${{ matrix.pr_num }}) - [${{ matrix.language }}]
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' && fromJson(needs.discover.outputs.matrix).include != null }} 
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODEQL_RAM: 12000
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Prepare Workspace and Checkout PR
        id: pr_checkout
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"
          
          mkdir -p /tmp/scripts && cp scripts/* /tmp/scripts/ 2>/dev/null || true
          rm -rf ./*
          
          gh pr checkout ${{ matrix.pr_num }} --repo ${{ matrix.repo_name }}
          
          mkdir -p scripts && cp /tmp/scripts/* scripts/ 2>/dev/null || true
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          db-location: ${{ runner.temp }}/codeql_db
          trap-caching: false
          queries: code-scanning

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/pr:${{ matrix.category_name }}"
          output: sarif-results
          upload: false
          upload-database: false
          wait-for-processing: false 
          threads: 2

      - name: Create Summary
        if: always()
        run: |
          SAFE_REPO=$(echo "${{ matrix.repo_name }}" | sed 's/\//_SLASH_/g')
          SAFE_AGENT=$(echo "${{ matrix.agent_name }}" | sed 's/ /_/g')
          
          mkdir -p scripts && cp -r /tmp/scripts/* scripts/ 2>/dev/null || true
          
          LIVE_LOC=$(gh pr view ${{ matrix.pr_num }} --repo ${{ matrix.repo_name }} --json additions,deletions --jq '.additions + .deletions' 2>/dev/null || echo "1")
          if [ -z "$LIVE_LOC" ] || [ "$LIVE_LOC" = "0" ]; then LIVE_LOC="1"; fi
          
          export PR_LOC=$LIVE_LOC
          export PR_REPO="${{ matrix.repo_name }}"
          export PR_NUM="${{ matrix.pr_num }}"
          
          if [ -d "sarif-results" ] && [ "$(ls -A sarif-results/*.sarif 2>/dev/null)" ]; then
            cp sarif-results/*.sarif ./results.sarif 2>/dev/null || true
            cp sarif-results/*.sarif "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.sarif" 2>/dev/null || true
            echo "success" > "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.success"
            
            python scripts/parse-results.py || true
            
            if [ -f "sarif-results/summary.json" ]; then
              cp sarif-results/summary.json "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.json"
            else
              echo '{"high": 0, "medium": 0, "low": 0, "total_issues": 0, "files_changed": 1, "cwes_discovered": []}' > "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.json"
            fi
          else
            echo "failed" > "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.failed"
            echo '{"high": 0, "medium": 0, "low": 0, "total_issues": 0, "files_changed": 0, "cwes_discovered": []}' > "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.json"
          fi
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}

      - name: Save Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.category_name }}
          path: |
            *.sarif
            *.success
            *.failed
            *.json
          retention-days: 1

  report:
    name: Consolidate Final Report
    needs: [discover, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      # 🚀 GLOBAL RETRIEVAL PIPELINE: Downloads artifacts directly from the active running context
      - name: Download Cross-Run Matrix Artifacts Globally
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          echo "📥 Executing history sweep for active chunk artifacts..."
          mkdir -p all-results

          # Use the active run ID directly to ensure it matches your current execution context
          RUN_ID="${{ github.run_id }}"
          echo "Target Workflow Run ID located: $RUN_ID"

          # Safely download the specific artifact patterns generated by your scan step
          gh run download "$RUN_ID" --pattern "sarif-*" --dir "all-results" || true
          gh run download "$RUN_ID" --name "master-database-accumulation" --dir "all-results" || true

          rm -f all-results/results.sarif || true
          echo "📁 Restored Unified Data Queue State:"
          ls -R all-results/

      - name: Generate Consolidated Summary Table
        env:
          MATRIX_JSON: ${{ needs.discover.outputs.matrix }}
          SCAN_TYPE: "automated"
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }} 
          # Pass the dynamic offset straight down so the script enforces local os.remove() clear locks
          CHUNK_OFFSET: ${{ github.event.inputs.offset || github.event.client_payload.offset || '0' }}
        run: |
          python scripts/consolidate-report.py

      - name: Archive Accumulated Dataset State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-database-accumulation
          path: |
            all-results/accumulated_database.json
          retention-days: 5

      # 🚀 SECURE GRADUATED STOP GATEWAY:
      # Evaluates the official variable returned from the script. Stops instantly if has_more_data == false.
      - name: Chain Next Chunk Automatically
        if: ${{ needs.discover.outputs.has_more_data == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          NEXT_OFFSET: ${{ needs.discover.outputs.next_offset }}
        run: |
          echo "🔄 Loop transition verified. Data remains in CSV input queue. Advancing chain to offset: $NEXT_OFFSET"
          
          gh api repos/${{ github.repository }}/dispatches \
            -F event_type="run_test_chunk" \
            -F client_payload[offset]="$NEXT_OFFSET"
