name: "TEST - AI Multi-Language Chained Scanner"

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'CSV Line Data Offset Pointer'
        required: false
        default: '0'

permissions:
  contents: read
  security-events: write
  actions: write # Required to dispatch self-trigger chaining actions

jobs:
  discover:
    name: Find AI PRs (Test Block)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix_data }}
      next_offset: ${{ steps.detect.outputs.next_offset }}
      has_more_data: ${{ steps.detect.outputs.has_more_data }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Discover Scan Matrix
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          CHUNK_OFFSET: ${{ github.event.inputs.offset || '0' }}
        run: |
          pip install pandas
          python scripts/test-ai-scanner.py

  analyze:
    name: Test Scan ${{ matrix.repo_name }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' && fromJson(needs.discover.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Workspace and Checkout PR
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          mkdir -p /tmp/scripts && cp scripts/* /tmp/scripts/
          rm -rf ./*
          gh pr checkout ${{ matrix.pr_num }} --repo ${{ matrix.repo_name }}
          mkdir -p scripts && cp /tmp/scripts/* scripts/

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.matrix.language || matrix.language }}
          build-mode: none
          db-location: ${{ runner.temp }}/codeql_db

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/pr:${{ matrix.category_name }}"
          output: sarif-results
          upload: false

      - name: Create Summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          SAFE_REPO=$(echo "${{ matrix.repo_name }}" | sed 's/\//_SLASH_/g')
          SAFE_AGENT=$(echo "${{ matrix.agent_name }}" | sed 's/ /_/g')
          LIVE_LOC=$(gh pr view ${{ matrix.pr_num }} --repo ${{ matrix.repo_name }} --json additions,deletions --jq '.additions + .deletions' 2>/dev/null || echo "1")
          export PR_LOC=$LIVE_LOC
          export PR_REPO="${{ matrix.repo_name }}"
          export PR_NUM="${{ matrix.pr_num }}"
          
          if [ -d "sarif-results" ] && [ "$(ls -A sarif-results/*.sarif 2>/dev/null)" ]; then
            cp sarif-results/*.sarif "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.sarif"
            echo "success" > "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.success"
            python scripts/parse-results.py || true
            cp ./summary.json "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.json" || true
          else
            echo "failed" > "./${SAFE_REPO}--${{ matrix.pr_num }}--${{ matrix.language }}--${SAFE_AGENT}--${LIVE_LOC}.failed"
          fi

      - name: Save Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.category_name }}
          path: |
            *.sarif
            *.success
            *.failed
            *.json
          retention-days: 1

  report:
    name: Consolidate Final Test Report
    needs: [discover, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Download Active Matrix Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sarif-*
          path: all-results
          merge-multiple: true

      - name: Fetch Historical Database Cache
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
        run: |
          gh run download --name "test-database-accumulation" --dir "all-results" || true
          find all-results/ -name "results.sarif" -delete || true

      - name: Generate Consolidated Summary Table
        env:
          SCAN_TYPE: "automated"
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }} 
        run: |
          python scripts/test-consolidate-report.py

      - name: Archive Accumulated Dataset State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-database-accumulation
          path: |
            all-results/test_accumulated_database.json
          retention-days: 1

      - name: Chain Next Chunk Automatically
        if: ${{ needs.discover.outputs.has_more_data == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GLOBAL_SCAN_PAT }}
          NEXT_OFFSET: ${{ needs.discover.outputs.next_offset }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/test-codeql-scan.yml/dispatches \
            -F ref="${{ github.ref_name }}" \
            -F inputs[offset]="$NEXT_OFFSET"
